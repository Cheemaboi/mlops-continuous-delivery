name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run tests
        run: python -m pytest

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate immutable artifact identity
        id: metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(tr -d '[:space:]' < VERSION)" == "$version" ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.metadata.outputs.git_commit }}
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest

  deploy-staging:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy exact release image to staging
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.version }}
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d --name mlops-api --restart unless-stopped -p 5000:5000 ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.version }}
      - name: Gate promotion on staging health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            "http://${{ secrets.STAGING_HOST }}:5000/health"

  deploy-production:
    needs:
      - build-and-publish
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy the staging-validated image to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            docker pull ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.version }}
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d --name mlops-api --restart unless-stopped -p 5000:5000 ${{ needs.build-and-publish.outputs.image }}:${{ needs.build-and-publish.outputs.version }}
